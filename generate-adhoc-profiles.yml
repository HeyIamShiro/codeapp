
name: Generate Ad Hoc Signing Profiles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-adhoc-profiles:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Prepare App Store Connect API key
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
        run: |
          ruby -rjson -e '
            data = {
              key_id: ENV.fetch("APPLE_KEY_ID"),
              issuer_id: ENV.fetch("APPLE_ISSUER_ID"),
              key: ENV.fetch("APPLE_KEY_CONTENT"),
              duration: 1200,
              in_house: false
            }
            File.write(File.join(ENV.fetch("RUNNER_TEMP"), "AuthKey.json"), JSON.generate(data), mode: "w", perm: 0600)
          '

      - name: Generate Ad Hoc profiles
        env:
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail

          GIT_AUTH="$(printf 'x-access-token:%s' "$MATCH_GIT_TOKEN" | base64)"

          fastlane match adhoc \
            --app_identifier "com.heyiamshiro.codeapp,com.heyiamshiro.codeapp.extension" \
            --team_id "MA25SK6667" \
            --git_url "https://github.com/HeyIamShiro/codeapp-certificates" \
            --git_branch "main" \
            --git_basic_authorization "$GIT_AUTH" \
            --api_key_path "$RUNNER_TEMP/AuthKey.json" \
            --skip_confirmation

      - name: Remove temporary API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.json"
