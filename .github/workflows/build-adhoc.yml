name: Build Ad Hoc IPA

on:
  workflow_dispatch:

permissions:
  # write: needed to replace the "adhoc" release used for over-the-air install.
  contents: write

jobs:
  build:
    # Same runner/Xcode as upstream build.yml: CodeApp/Iconv2.icon is an
    # Icon Composer file that Xcode 16 cannot compile.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the version that wrote the Match repo (match_version.txt).
      # The Gemfile.lock pin (2.205.1) cannot decrypt match_encrypted_v2 files.
      - name: Install Fastlane
        run: gem install fastlane -v 2.241.2 --no-document

      - name: Prepare API key
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
        run: |
          ruby -rjson -e '
            data = {
              key_id: ENV.fetch("APPLE_KEY_ID"),
              issuer_id: ENV.fetch("APPLE_ISSUER_ID"),
              key: ENV.fetch("APPLE_KEY_CONTENT"),
              duration: 1200,
              in_house: false
            }
            File.write(
              File.join(ENV.fetch("RUNNER_TEMP"), "AuthKey.json"),
              JSON.generate(data),
              mode: "w",
              perm: 0600
            )
          '

      - name: Build Ad Hoc IPA
        env:
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
          XCODE_PATH: /Applications/Xcode_26.2.app
        run: |
          set -euo pipefail

          # The temporary keychain only lives on this ephemeral runner, so a
          # random per-run password is safer than a stored secret.
          TEMP_KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$TEMP_KEYCHAIN_PASSWORD"
          export TEMP_KEYCHAIN_PASSWORD

          GIT_AUTH="$(printf 'x-access-token:%s' "$MATCH_GIT_TOKEN" | base64)"

          fastlane _2.241.2_ ios adhoc_build \
            git_authorization:"$GIT_AUTH"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-AdHoc-IPA
          path: Code.ipa
          if-no-files-found: error

      # Over-the-air install: iPadOS installs from an itms-services:// link that
      # points at a manifest.plist served over HTTPS. Both files go on a single
      # public pre-release tagged "adhoc" that is replaced on every build, so
      # the install link never changes. The IPA only installs on devices whose
      # UDID is in the Ad Hoc profile.
      - name: Publish OTA install release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: adhoc
          BUNDLE_ID: com.heyiamshiro.codeapp
        run: |
          set -euo pipefail

          BASE_URL="https://github.com/${GH_REPO}/releases/download/${TAG}"

          unzip -p Code.ipa 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Info.plist")"

          cat > manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>${BASE_URL}/Code.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>${BUNDLE_ID}</string>
                  <key>bundle-version</key>
                  <string>${VERSION}</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>Code App</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          plutil -lint manifest.plist

          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" Code.ipa manifest.plist \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ad Hoc build #${GITHUB_RUN_NUMBER} (${VERSION} build ${BUILD})" \
            --notes "Ad Hoc build of ${GITHUB_SHA} from run ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}. Install on the iPad by opening this in Safari: itms-services://?action=download-manifest&url=${BASE_URL}/manifest.plist"

          {
            echo "### Install on iPad"
            echo "Paste into Safari on the iPad:"
            echo '```'
            echo "itms-services://?action=download-manifest&url=${BASE_URL}/manifest.plist"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.json"
